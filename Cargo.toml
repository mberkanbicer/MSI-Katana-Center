[workspace]
resolver = "2"
members = [
    "crates/msi-core",
    "crates/msi-dbus",
    "crates/msi-daemon",
    "crates/msi-device-db",
    "crates/msi-hardware",
    "crates/msicenter-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "4"
